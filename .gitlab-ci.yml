stages:
  - build
  - test
  - cleanup
  - publish
  - release

# ── build ─────────────────────────────────────────────────────────────────────

.build-template:
  stage: build
  image: docker:29.9.0@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  services:
    - docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  before_script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
    - docker buildx create --use
  script:
    - export POWERDNS_API_PROXY_VERSION=$(cat VERSION)
    - |
      docker buildx build \
        --platform "linux/${TARGET_ARCH}" \
        --provenance=false \
        --sbom=false \
        --build-arg POWERDNS_API_PROXY_VERSION="${POWERDNS_API_PROXY_VERSION}" \
        --label org.opencontainers.image.created=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --label org.opencontainers.image.revision="${CI_COMMIT_SHA}" \
        --cache-from=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache" \
        --cache-to=type=registry,ref="${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-buildcache",mode=max \
        --tag "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}" \
        --push \
        .

build:amd64:
  extends: .build-template
  tags:
    - saas-linux-small-amd64
  variables:
    TARGET_ARCH: amd64

build:arm64:
  extends: .build-template
  tags:
    - saas-linux-small-arm64
  variables:
    TARGET_ARCH: arm64

# ── test ──────────────────────────────────────────────────────────────────────
# TODO: Write real tests for this image
.test-template:
  stage: test
  image: docker:29.9.0@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  services:
    - docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  before_script:
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - docker pull "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}"
    # For now we only check if the required Python modules can be imported successfully. This should catch missing dependencies.
    - docker run --rm --entrypoint /usr/local/bin/python3 "${CI_REGISTRY_IMAGE}:${TARGET_ARCH}-${CI_COMMIT_SHA}" -c "import powerdns_api_proxy, fastapi, uvicorn, pydantic_core; print('OK')"

test:amd64:
  extends: .test-template
  needs:
    - build:amd64
  tags:
    - saas-linux-small-amd64
  variables:
    TARGET_ARCH: amd64

test:arm64:
  extends: .test-template
  needs:
    - build:arm64
  tags:
    - saas-linux-small-arm64
  variables:
    TARGET_ARCH: arm64

# ── cleanup ───────────────────────────────────────────────────────────────────
# This removes images from the registry if there is no commit tag
delete_image:
  stage: cleanup
  needs:
    - job: test:amd64
      optional: true
    - job: test:arm64
      optional: true
  variables:
    REGCTL_VERSION: v0.11.6
  rules:
      - if: '$CI_COMMIT_TAG == null'
        when: always
  image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  script:
    - apk update
    - apk add curl
    - >
      curl
      --fail-with-body
      --location
      "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64"
       > /usr/bin/regctl
    - chmod 755 /usr/bin/regctl
    - regctl registry login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_REGISTRY_PASSWORD}
    - regctl tag rm "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}"
    - regctl tag rm "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

# ── publish ───────────────────────────────────────────────────────────────────

publish:
  stage: publish
  image: docker:29.9.0@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  services:
    - docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - test:amd64
    - test:arm64
  before_script:
    # Check if CI_COMMIT_TAG is equal to the version in the VERSION file to prevent accidental mismatches.
    - |
      if [ "$CI_COMMIT_TAG" != "$(cat VERSION)" ]; then
        echo "Error: CI_COMMIT_TAG ($CI_COMMIT_TAG) does not match VERSION file ($(cat VERSION))"
        exit 1
      fi
    - |
      if [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi
  script:
    - export POWERDNS_API_PROXY_VERSION=$(cat VERSION)
    - |
      docker buildx imagetools create \
        --tag "${CI_REGISTRY_IMAGE}:${POWERDNS_API_PROXY_VERSION}" \
        "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}" \
        "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

    # Create/update the latest multi-architecture tag.
    - |
      docker buildx imagetools create \
        --tag "${CI_REGISTRY_IMAGE}:latest" \
        "${CI_REGISTRY_IMAGE}:amd64-${CI_COMMIT_SHA}" \
        "${CI_REGISTRY_IMAGE}:arm64-${CI_COMMIT_SHA}"

# ── release ───────────────────────────────────────────────────────────────────

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - publish
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    description: "powerdns-api-proxy $CI_COMMIT_TAG"