services:
  pdns-auth-init-db:
    container_name: pdns-auth-init-db
    image: registry.gitlab.com/joern_schonhoff/pdns-auth-init-db:5.1.4@sha256:6e0e658fc1e952a8bfaa62ee5ceffe28c7f619b6426c8087c0ec30564cf0756a
    env_file:
      - ./.env.example
    environment:
      - PDNS_GSQLITE3_DATABASE=/data/pdns.sqlite3
    volumes:
      - sqlite-data:/data
    networks:
      - pdns-auth-network
  pdns-auth-init-conf:
    container_name: pdns-auth-init-conf
    image: registry.gitlab.com/joern_schonhoff/pdns-auth-init-conf:0.1.0@sha256:5410b3f7ff0b35615b95a59246298d98e7d4d26b143f7fe46bdbf03d8805429b
    env_file:
      - ./.env.example
    volumes:
      - pdns-auth-config:/etc/pdns
    user: 0:0
    depends_on:
      pdns-auth-init-db:
        condition: service_completed_successfully
    networks:
      - pdns-auth-network
  pdns-auth:
    container_name: pdns-auth
    image: registry.gitlab.com/joern_schonhoff/pdns-auth-distroless:5.1.5@sha256:1f7258c615817e00069b00d1bedeff8ad69847cf5f206ad0df834eb46b6f486d
    env_file:
      - ./.env.example
    ports:
      - "5353:53"
    volumes:
      - pdns-auth-config:/etc/pdns
      - sqlite-data:/var/lib/pdns
    depends_on:
      pdns-auth-init-conf:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/dns-healthcheck", "--check-udp", "--check-tcp"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - pdns-auth-network
  powerdns-api-proxy:
    container_name: powerdns-api-proxy
    image: registry.gitlab.com/joern_schonhoff/powerdns-api-proxy-distroless:v1.13.0@sha256:a7afccfff4ed4dd730f5410a1f2fbd7491a3b867e74cf53c7d9580feda311683
    environment:
      - PROXY_CONFIG_PATH=/config/config.yml
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./config.yml:/config/config.yml:ro
    ports:
      - "8000:8000"
    depends_on:
      pdns-auth:
        condition: service_healthy
    networks:
      - pdns-auth-network

networks:
  pdns-auth-network:
    driver: bridge

volumes:
  pdns-auth-config:
  sqlite-data: